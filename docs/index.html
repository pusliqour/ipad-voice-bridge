<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>iPad Microphone</title>
<style>
:root { color-scheme: dark; font: 17px system-ui; background: #101622; color: #eef4ff; }
body { margin: 0; min-height: 100svh; display: grid; place-items: center; }
main { width: min(28rem, calc(100% - 3rem)); }
h1 { font-size: clamp(2rem, 6vw, 3rem); letter-spacing: -.045em; }
p { min-height: 3em; color: #b9c8df; line-height: 1.5; }
button { width: 100%; min-height: 3.25rem; border: 0; border-radius: .65rem; background: #a8d6ff; color: #122236; font: inherit; font-weight: 700; }
button:disabled { opacity: .45; }
</style>
<main>
<h1>iPad Microphone</h1>
<p id="status" role="status">Open the pairing link generated by the Mac receiver.</p>
<button id="toggle" disabled>Connect microphone</button>
</main>
<script type="module">
const status = document.querySelector("#status");
const toggle = document.querySelector("#toggle");
const parameters = new URLSearchParams(location.hash.slice(1));
const endpoint = parameters.get("receiver");
const secret = parameters.get("key");
history.replaceState(null, "", location.pathname + location.search);
let session;

function stop(message) {
  const previous = session;
  session = undefined;
  previous?.stream?.getTracks().forEach(track => track.stop());
  previous?.context?.close().catch(() => {});
  previous?.socket?.close();
  status.textContent = message;
  toggle.textContent = "Connect microphone";
  toggle.disabled = true;
}

if (endpoint && /^wss:\/\/[^/?#]+\/audio$/.test(endpoint) && /^[a-f0-9]{64}$/.test(secret ?? "")) {
  toggle.disabled = false;
  status.textContent = "Ready to pair with your Mac.";
  toggle.addEventListener("click", async () => {
    if (session) return stop("Disconnected. Generate a fresh pairing link to reconnect.");
    const current = session = {};
    toggle.textContent = "Disconnect";
    status.textContent = "Connecting to the Mac…";
    try {
      current.context = new AudioContext();
      await current.context.resume();
      const keyBytes = Uint8Array.from(secret.match(/../g), byte => parseInt(byte, 16));
      const key = await crypto.subtle.importKey("raw", keyBytes, "AES-GCM", false, ["encrypt"]);
      if (session !== current) return;
      const socket = current.socket = new WebSocket(endpoint);
      const send = async (kind, data) => {
        const nonce = crypto.getRandomValues(new Uint8Array(12));
        const encrypted = await crypto.subtle.encrypt({name: "AES-GCM", iv: nonce, additionalData: Uint8Array.of(kind)}, key, data);
        if (socket.readyState !== WebSocket.OPEN || socket.bufferedAmount > 131072) return;
        const packet = new Uint8Array(13 + encrypted.byteLength);
        packet[0] = kind;
        packet.set(nonce, 1);
        packet.set(new Uint8Array(encrypted), 13);
        socket.send(packet);
      };
      socket.onopen = () => send(1, new TextEncoder().encode("ipad-voice-v1")).catch(() => stop("Pairing failed."));
      socket.onerror = () => { if (session === current) stop("Couldn’t reach the Mac receiver."); };
      socket.onclose = () => { if (session === current) stop("The Mac receiver disconnected. Generate a fresh pairing link."); };
      socket.onmessage = async ({data}) => {
        if (data === "pending") {
          status.textContent = "Approve this connection on your Mac.";
          return;
        }
        if (data !== "approved" || current.requested) return;
        current.requested = true;
        try {
          const stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true}, video: false});
          if (session !== current) {
            stream.getTracks().forEach(track => track.stop());
            return;
          }
          current.stream = stream;
          const context = current.context;
          await context.audioWorklet.addModule(new URL("capture.js", location.href));
          if (session !== current) return;
          const input = context.createMediaStreamSource(stream);
          const capture = new AudioWorkletNode(context, "capture");
          const silence = context.createGain();
          silence.gain.value = 0;
          input.connect(capture).connect(silence).connect(context.destination);
          capture.port.onmessage = event => send(2, event.data).catch(() => stop("Audio transmission failed."));
          stream.getTracks()[0].onended = () => stop("Safari stopped sharing the microphone.");
          status.textContent = "Microphone live. Keep this page open while speaking.";
        } catch {
          if (session === current) stop("Safari could not start the microphone. Check microphone permission and pair again.");
        }
      };
    } catch {
      if (session === current) stop("Couldn’t start the connection.");
    }
  });
}
window.addEventListener("pagehide", () => stop("Disconnected."));
</script>
</html>
